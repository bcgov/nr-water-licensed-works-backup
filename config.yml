# Water Licensed Works - backup and integrity checks
#
# Settings only. Secrets come from environment variables:
#   AGO_USERNAME_WINS, AGO_PASSWORD_WINS
#   S3_NRS_ENDPOINT, S3_GSS_GEODRIVE_KEY_ID, S3_GSS_GEODRIVE_SECRET_KEY
#
# Never put credentials in this file.


# Everything is stored and compared in UTC. This zone is used only where a
# local calendar boundary decides an outcome: which month a backup counts
# towards for promotion, the date stamp on a prefix, and the expected-slot
# arithmetic in the notify job.
timezone: America/Vancouver


agol:
  url: https://governmentofbc.maps.arcgis.com


# The two hosted feature layers being protected.
# Note the field lists differ - points has no DISPLAY_COLOUR.
layers:

  lines:
    item_id: a938dd3fcafa4b98baee3fcb5ab59fe8
    layer_index: 0
    name: WATER_LICENSED_WORKS_LINES
    geometry: polyline
    # Shape__Length exists on lines only, so the total-length metric
    # is collected for this layer and skipped for points.
    has_length_field: true
    null_check_fields:
      - TWRK_TAG
      - FEATURE_CODE
    distinct_value_field: FEATURE_CODE

  points:
    item_id: 848f3c3900da4b1b907a415154a53042
    layer_index: 0
    name: WATER_LICENSED_WORKS_POINTS
    geometry: point
    has_length_field: false
    null_check_fields:
      - TWRK_TAG
      - FEATURE_CODE
    distinct_value_field: FEATURE_CODE


storage:
  bucket: gssgeodrive
  # The bucket is shared with other GSS
  # projects, so everything this project reads, writes, lists or deletes
  # lives under this prefix and nothing may construct a key outside it.
  prefix: authorizations/backups/water_licensed_works/

  # Sub-prefixes, appended to the above.
  paths:
    rotating: rotating/
    monthly: monthly/
    yearly: yearly/
    metrics: metrics/
    status: status/
    # Only jenkins/notify.py reads or writes under here, and the only object
    # it holds is that job's deduplication state - what it last sent mail
    # about, so that an hourly poll produces occasional email rather than
    # hourly email. It is not a backup and nothing restores from it; losing it
    # costs one duplicate alert. Kept as a sibling of the tiers rather than
    # inside one so that nobody looking for a restore point finds it.
    notify: notify/

    # The notification job's own code, published here by
    # publish_notify_code.py on every push to main and downloaded by that job
    # at the start of every build. It is here because the Jenkins agents that
    # run it cannot reach github.com and can reach object storage, so the
    # bucket carries the code to them. Two files and a manifest; not a backup,
    # and nothing restores from it.
    code: code/


backup:
  # item.export() is asynchronous - it queues a job on AGOL and returns.
  # Poll until the export item is ready, then give up rather than hanging
  # a scheduled run indefinitely. A timeout is SYSTEM_FAIL, not DATA_FAIL.
  #
  # Measured, not guessed. Two real exports on 2026-08-14:
  #   points  53,987 features,  7.2 MB service -> 54.5 min, 3.0 MB zip
  #   lines  142,523 features, 39.3 MB service -> 22.6 min, 14.5 MB zip
  #
  # The larger layer was the faster one, so the wait is AGOL queue time and
  # not data volume. That means the spread is the thing to size for, not the
  # average: 90 minutes is a little under twice the worst run observed.
  # Raise it if a real run ever times out - a slow export is not a fault,
  # and failing a backup that would have succeeded is the worse outcome.
  export_timeout_minutes: 90

  # At tens of minutes per export, polling every 15 seconds was hundreds of
  # pointless calls per run.
  export_poll_seconds: 60

  # Artifact validation, run before anything is uploaded. DESIGN.md 6.5.
  # This proves the downloaded file is intact. It does NOT prove the data
  # inside it is good - that is the check job's role, and the reason
  # promotion additionally requires a PASS.
  validation:
    require_nonzero: true
    # The count inside the exported FGDB is compared against a live count
    # taken at export time. A small difference is legitimate - an edit can
    # land while the export is running. A large one means the artifact is
    # not a faithful snapshot and the run fails.
    count_tolerance_percent: 1   # PLACEHOLDER


retention:
  # Mon/Wed/Fri snapshots. Raised above the 3 in the client's document
  # because 3 sets do not survive a week of no response: a Tuesday
  # incident leaves every rotating copy bad by the following Monday.
  # At roughly 8 MB per set the cost of a longer window is nil.
  rotating_sets: 8

  # Promoted from the first rotating set of the month whose paired
  # check status was PASS. See the promotion section below.
  monthly_sets: 12

  # Promoted from the first monthly set of the year. Never pruned.
  yearly_sets: null

  # Metrics files are a few KB each, so history is cheap and useful.
  metrics_days: 400

  # Pruning is paused while the most recent check status is DATA_FAIL,
  # so a live incident cannot quietly evict the last good copy while
  # nobody is acting on the alert.
  pause_prune_on_data_fail: true
  # Hard ceiling so a long-unresolved failure cannot grow without limit.
  rotating_sets_max: 20
  # Escalate if pruning has been paused this long.
  paused_prune_alert_days: 7


promotion:
  # Which check outcomes make a rotating set eligible for the monthly tier.
  #
  # Some gate is needed. Artifact validation (zip opens, counts sane) proves
  # the file is intact, NOT that the data is good - a faithful snapshot of
  # corrupt data passes artifact validation cleanly. Without a gate a corrupt
  # set can become the monthly anchor that the trend comparison is measured
  # against for the rest of the month, so the reference for "normal" would
  # itself be wrong.
  #
  # But the gate was PASS only until 2026-08-19, and that was too tight.
  # WARN is defined as below the action threshold - it routes to the
  # developer alone precisely because it is not worth the client acting on -
  # so treating it as unfit to archive contradicted what it means everywhere
  # else. And the cost was real rather than theoretical: the feature_count
  # rule compares against the 30-day median and the monthly anchor as well as
  # yesterday, so one legitimate bulk load can hold a WARN for weeks. Every
  # backup run in that window would have been refused promotion, and a data
  # issue that nobody is scheduled to fix for a fortnight would have quietly
  # cost the month its archive copy.
  #
  # So: only a verdict that the data is actually wrong blocks the archive.
  # DATA_FAIL is that verdict - a suspiciously low count, a map cell emptied,
  # a schema change. Everything else is reported and blocks nothing, which is
  # the same rule the validity findings follow (DESIGN.md 7.6.1).
  #
  # SYSTEM_FAIL and BASELINE are absent for a different reason: neither is a
  # verdict at all. One means the check could not run, the other that there
  # was nothing to compare against. Both clear within a day or two and both
  # raise their own alert, so neither has the weeks-long backlog problem the
  # WARN change was made for. Add them here if a month is ever at risk of
  # going unarchived because the check job was down for it.
  promote_on: [PASS, WARN]
  # If no set is eligible yet, promotion retries on the next backup run.
  # Alert if the month is this far in with nothing promoted.
  no_candidate_alert_days: 10


schedule:
  # Used by the Jenkins notify job to decide whether a run is overdue.
  # These must match the cron expressions in .github/workflows/.
  #
  # These days are LOCAL, in the timezone at the top of this file, because
  # that is what the expected-slot arithmetic needs. The workflow crons are
  # UTC and their day-of-week list is deliberately one ahead:
  #
  #   checks.yml   0 2 * * *         02:00 UTC daily       = 19:00 PDT / 18:00 PST
  #   backup.yml   0 4 * * 2,4,6     04:00 UTC Tue/Thu/Sat = 21:00 PDT / 20:00 PST
  #                                                          on Mon/Wed/Fri
  #
  # 21:00 on a Vancouver Monday is already 04:00 Tuesday in UTC. The two are
  # the same schedule written in two timezones - change them together, and
  # keep the check slot ahead of the backup slot so that promotion can pair
  # them by local date. The gap is two hours, which absorbs an Actions cron
  # delay many times over for a six-minute check.
  backup_days: [monday, wednesday, friday]
  checks_daily: true

  # The UTC hour each cron fires at, taken straight from the workflow files
  # above. The notify job reads these rather than a local hour, because the
  # crons ARE in UTC: read that way the expected slot is exact all year, where
  # a local hour would be an hour out for whichever half of the year is not
  # the one it was written in. The local day filter above is then applied to
  # the local weekday of each UTC instant, which reproduces the cron's
  # one-day-ahead UTC day list without this being written down twice.
  checks_cron_utc_hour: 2
  backup_cron_utc_hour: 4

  # Staleness is measured from the EXPECTED SLOT, not as hours since
  # the last run. Measuring hours-since would false-alarm every weekend,
  # because the Friday-to-Monday backup gap is 72 hours by design.
  # Rule: once an expected slot has passed, allow this much grace before
  # treating a missing result as a failure.
  #
  # The check grace was 2 until 2026-08-28, and it was sized against
  # "Actions can start a cron late but never early" with no figure attached.
  # There is a figure now: the check job ran 26-32 minutes late every day
  # from 19 to 26 August, then 107 minutes, then 165. The 165 was 45 minutes
  # past the grace, so a poll landed in the gap and reported a stopped
  # pipeline for a run that was merely late and went on to PASS. Four hours
  # covers what has actually been observed with headroom, and the cost is two
  # more hours before a genuinely stopped daily job is reported - which on a
  # job that runs in the evening and is read in the morning is no cost at all.
  #
  # Raise it again if Actions keeps slipping, but look at the local-midnight
  # margin first: both jobs stamp their output with the LOCAL date, so a
  # backup delayed past three hours files itself under the wrong day and
  # stops pairing with the check that covered it. That breaks something;
  # this only sends an email.
  checks_grace_hours: 4
  backup_grace_hours: 6


checks:
  # Spatial bin distribution - the check that catches a localized deletion
  # that feature count and extent both miss. DESIGN.md 7.2.1 and 7.2.2.
  #
  # Geohash binning was the original plan. It does not exist on these
  # services: queryBins bins on numeric and date fields only, and although
  # the layers advertise supportsLod with supportedLodTypes ['geohash'] they
  # carry no lodInfos and reject every lod value. So the grid is ours - a
  # fixed lattice of square cells over BC in BC Albers metres, with one
  # returnCountOnly query per cell. Measured at 5.6 minutes for both layers.
  #
  # DO NOT CHANGE THESE VALUES TO TUNE THE CHECK.
  #
  # Bin counts are only comparable against bins of the same size in the same
  # place. Changing the cell size or the origin silently invalidates every
  # stored metrics file and restarts the 4-6 week baseline period. This is
  # structural, not a threshold. Cell size can be aggregated upwards after
  # the fact (four 50 km cells sum to one 100 km cell) but never split
  # downwards, which is why 50 km is the stored resolution.
  spatial_grid:
    # Anchored to a fixed envelope, deliberately NOT derived from the live
    # data extent: the two bad point records (DESIGN.md 4) put the points
    # extent 4,000 km west, which would generate a grid over the Pacific.
    xmin: 200000
    ymin: 300000
    xmax: 1900000
    ymax: 1800000
    cell_size_metres: 50000
    wkid: 3005

    # Known-answer guard, run every pass. The cell counts must add back up
    # to the live feature count. Points partition the grid exactly, less
    # anything outside it; a polyline crossing a cell boundary is counted in
    # both cells, so lines run slightly over - measured at 0.51% over at
    # this cell size. A discrepancy beyond this means the geometry filter is
    # malformed and no number from the pass can be trusted. Fail the run
    # rather than record it. DESIGN.md 12 explains why this matters.
    max_sum_overcount_percent: 2

  # Rolling comparisons, in addition to the previous-day comparison.
  trend_window_days: 30
  use_monthly_anchor: true

  # How extent drift is measured: the largest displacement of any of the
  # four bounding box corners, in metres, against the comparison run.
  # Chosen over area or diagonal change because it catches both a
  # translated extent and an expanded one, and is easy to reason about
  # when reading an alert.
  extent_drift_method: max_corner_displacement


# ---------------------------------------------------------------------------
# THRESHOLDS - PER LAYER
#
# Every value below except the schema rule is a PLACEHOLDER.
# They are replaced with values derived from the 4-6 week baseline period.
# Do not treat these as tuned. See DESIGN.md section 7.4.
#
# Thresholds are per-layer because the layers behave differently: lines
# has a total_length metric that points does not, and edit volumes and
# volatility will diverge once baselined.
#
# fail_when: both  -> percent AND absolute must both be exceeded
# fail_when: any   -> either one is enough
#
# null_rate.increase_percent is in percentage POINTS, not a relative
# change. A field going from 0.1% null to 5.1% null has risen by 5.0.
#
# There is no distinct_values rule. DESIGN.md 7.2 proposed one to catch a
# domain violation on FEATURE_CODE, and measurement on 2026-08-14 showed
# there is no usable rule to write yet. Lines uses 29 distinct codes
# against a 15-value domain and points 35 against 10, but the excess is
# only 263 and 192 features (0.18% and 0.36%), spread across codes
# carried by a handful of records each - 'EA0610200' and 'EA6100200' are
# single mistyped records of 'EA06100200'. That is years of accumulated
# slips rather than an event. A rule on domain membership fails every run
# forever; a rule on a code appearing since the last check fires on the
# next typo, at a severity that would pause pruning and block promotion.
# The distinct values and their per-code counts are recorded in every
# metrics file instead, as value_counts and values_outside_domain, so the
# baseline period can decide what a useful rule would look like.
# The risk this leaves uncovered is in DESIGN.md 7.6.
#
# Only FAIL gates the nightly push in Phase 2. WARN alerts and is recorded.
# ---------------------------------------------------------------------------
thresholds:

  lines:
    feature_count:
      decrease:
        fail_when: both      # PLACEHOLDER
        percent: 10          # PLACEHOLDER
        absolute: 100        # PLACEHOLDER
        severity: FAIL
      increase:
        fail_when: any       # PLACEHOLDER
        percent: 25          # PLACEHOLDER
        severity: WARN
    zero_features:
      severity: FAIL
    spatial_bins:
      # min_features is the floor below which a cell is too sparse to
      # reason about. It is mandatory, not a preference: at 50 km the
      # lower quartile of populated cells holds 7 features and the
      # minimum holds 1, so without a floor any legitimate deletion of
      # a lone feature in a sparse cell raises a FAIL. Across ~300
      # populated cells that is a daily event, and a check that cries
      # wolf from the first week is filtered into a folder by the
      # second. DESIGN.md 7.2.2, requirement 1.
      bin_disappeared:
        min_features: 20     # PLACEHOLDER
        severity: FAIL
      bin_count_change:
        min_features: 20     # PLACEHOLDER
        percent: 20          # PLACEHOLDER
        severity: WARN
    extent:
      drift_metres: 5000     # PLACEHOLDER
      severity: WARN
    total_length:
      change_percent: 10     # PLACEHOLDER
      severity: WARN
    schema:
      # Not a placeholder. Any schema change should be looked at.
      # Covers field names and types, domain coded values, and subtypes.
      rule: exact_match
      severity: FAIL
    null_rate:
      increase_percent: 5    # PLACEHOLDER
      severity: WARN
    # No distinct_values rule - see the note above the thresholds block.

  points:
    feature_count:
      decrease:
        fail_when: both      # PLACEHOLDER
        percent: 10          # PLACEHOLDER
        absolute: 250        # PLACEHOLDER - larger layer, ~54k features
        severity: FAIL
      increase:
        fail_when: any       # PLACEHOLDER
        percent: 25          # PLACEHOLDER
        severity: WARN
    zero_features:
      severity: FAIL
    spatial_bins:
      # See the note on the lines layer above - the floor is required.
      bin_disappeared:
        min_features: 20     # PLACEHOLDER
        severity: FAIL
      bin_count_change:
        min_features: 20     # PLACEHOLDER
        percent: 20          # PLACEHOLDER
        severity: WARN
    extent:
      # Weak signal on this layer until the two known outlier records
      # (OBJECTID 150984, 150985) are corrected. See DESIGN.md section 4.
      drift_metres: 5000     # PLACEHOLDER
      severity: WARN
    schema:
      rule: exact_match
      severity: FAIL
    null_rate:
      increase_percent: 5    # PLACEHOLDER
      severity: WARN
    # No distinct_values rule - see the note above the thresholds block.


# Temporarily suppress rules for a known, approved change - a planned bulk
# edit or schema update. Suppressions are logged, and both dates are
# required so a suppression cannot be open-ended in either direction.
# Leave empty in normal operation.
suppressions: []
# Example:
#   - rule: feature_count
#     layer: points
#     from: 2026-09-14
#     until: 2026-09-30
#     reason: "Bulk load of 2026 licence works approved by data owner"


# ---------------------------------------------------------------------------
# NOTIFICATIONS
#
# Read by jenkins/notify.py on the GIS server. Nothing here is read by the
# GitHub Actions jobs - they only write status objects.
#
# Recipient addresses are NOT committed. Each role below names the
# environment variable that holds its address list (comma separated) on the
# Jenkins host. The routing itself lives here because it is policy rather
# than a secret, and a single ALERT_RECIPIENTS variable cannot express
# per-outcome routing.
# ---------------------------------------------------------------------------
notifications:

  roles:
    data_owner: ALERT_DATA_OWNER
    shared_inbox: ALERT_SHARED_INBOX
    developer: ALERT_DEVELOPER

  # The relay is reachable from the GIS server only, never from a GitHub
  # runner. Set on the Jenkins host: SMTP_HOST, SMTP_SENDER.
  #
  # Plain SMTP on the internal network, no authentication and no TLS, which
  # is what the existing staging script has always used. If the relay ever
  # starts requiring credentials that is a change to make deliberately.
  smtp_port: 25
  # An unreachable relay must fail the poll rather than hang an hourly job
  # until the next one starts on top of it.
  smtp_timeout_seconds: 30

  # DESIGN.md section 8.4. An empty list means no mail is sent.
  # Sending routine noise to the shared inbox is the fastest way to have
  # the whole channel rule-filtered into a folder, at which point a real
  # DATA_FAIL goes unread. That is why only DATA_FAIL reaches the client.
  routing:
    PASS: []
    BASELINE: [developer]
    WARN: [developer]
    DATA_FAIL: [data_owner, shared_inbox, developer]
    SYSTEM_FAIL: [developer]
    stale: [developer]
    prune_paused: [developer]
    # Not a run status. The backup reports this in the details of a run whose
    # status is PASS, and PASS routes to nobody, so without this row the
    # alert that promotion.no_candidate_alert_days asks for reaches no one.
    # Observed on the first production backup, 2026-08-18. DESIGN.md 8.4.
    no_monthly_candidate: [developer]
    # NOT A ROW OF ITS OWN EMAIL. These are the people ADDED to the
    # recipients of a check run's own message when that run reports a feature
    # whose coordinates place it outside the province.
    #
    # The check job reports that as a finding in its details rather than as a
    # rule violation, because a violation carries a severity and any
    # permanently non-PASS status permanently blocks promotion to the monthly
    # tier - the two known bad point records would trade away every monthly
    # restore point until somebody corrected them (DESIGN.md 7.6.1). Keeping
    # it out of the status is also what makes it invisible to the routing
    # above, and this row is what puts it back in front of somebody.
    #
    # Set as a data failure is, because that is what it is: the records
    # belong to Water Authorizations and only the data owner can correct
    # them, and the message carries the OBJECTIDs precisely so that whoever
    # reads it can. The cost of widening this way is that while a finding is
    # open these recipients also see BASELINE and WARN check runs, which the
    # rows above deliberately keep off them. Status changes are rare, so that
    # is a handful of emails rather than a stream - but if it is not wanted
    # during the baseline period, narrow this row to [developer] and nothing
    # else has to change. Decided 2026-08-19, DESIGN.md 7.6.1.1.
    features_outside_bc: [data_owner, shared_inbox, developer]
    weekly_summary: [data_owner, shared_inbox, developer]

  # A SYSTEM_FAIL lasting this long means backups are not running, which
  # is the data owner's problem as well as ours.
  system_fail_escalation_days: 3
  system_fail_escalation_adds: [data_owner, shared_inbox]

  # Reassurance that the control is alive. Not a failure-detection
  # mechanism - staleness detection does that. DESIGN.md section 8.2.
  weekly_summary:
    day: monday
    hour_local: 8


logging:
  level: INFO
